[Service]
Type=simple
User=sing-box
Group=sing-box
WorkingDirectory=/var/lib/sing-box
StateDirectory=sing-box
PIDFile=
RemainAfterExit=no
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE CAP_SYS_PTRACE CAP_DAC_READ_SEARCH
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_RAW CAP_NET_BIND_SERVICE CAP_SYS_PTRACE CAP_DAC_READ_SEARCH
ExecStartPre=
ExecStart=
ExecStart=/usr/bin/sing-box -D /var/lib/sing-box -c /etc/sing-box/config.json run
ExecStartPost=
ExecStartPost=+/usr/bin/python3 /usr/local/lib/singbox-manager/transparent.py sync
ExecStop=
ExecStopPost=
ExecStopPost=+/usr/bin/python3 /usr/local/lib/singbox-manager/transparent.py stop
TimeoutStartSec=35
TimeoutStopSec=15
